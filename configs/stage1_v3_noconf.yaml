# W3a: the v3 recipe trained from scratch WITHOUT the raw OpenPose
# confidence channel (x, y, dx, dy only). Answers the reviewer question
# the test-time zeroing experiment (revision/b6) cannot: does the
# confidence channel act as uncertainty weighting or as a quality side
# channel? Compare standard AUC, quality-controlled AUC, and delta
# against the v3 family. All temporal quantities in FRAMES.

model:
  widths: [48, 96, 136]
  blocks_per_stage: 2
  c_in: 4                   # x, y, dx, dy (no confidence)

data:
  cache_dir: cache/segments
  window: 200
  val_child_fraction: 0.2
  normalize_mode: image
  velocity: true
  confidence: false

train:
  epochs: 50
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  schedule: cosine
  balanced_sampling: false
  flip_prob: 0.5
  joint_dropout: 0.15

seed: 0
